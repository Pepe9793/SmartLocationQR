<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Location</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="location-container">

    <h1 id="name">Loading...</h1>

    <img
        id="locationPhoto"
        class="location-image"
        alt="Location photo"
    >

    <p id="description"></p>

    <div class="map-container">

        <iframe
            id="mapFrame"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>

    </div>

    <div class="coordinates">

        <p>
            <strong>Latitude:</strong>
            <span id="latitude"></span>
        </p>

        <p>
            <strong>Longitude:</strong>
            <span id="longitude"></span>
        </p>

    </div>

    <a
        id="directions"
        class="button"
        target="_blank">
        🧭 Get Directions
    </a>

</div>


<script>

async function loadLocation() {

    const params =
        new URLSearchParams(window.location.search);

    const id =
        params.get("id");

    try {

        const response =
            await fetch(
                "locations.json?v=" + Date.now()
            );

        const locations =
            await response.json();

        const location =
            locations.find(
                item => String(item.id) === String(id)
            );

        if (!location) {

            document.getElementById("name")
                .textContent =
                "Location not found";

            return;
        }


        // NAME

        document.getElementById("name")
            .textContent =
            location.name;


        // DESCRIPTION

        document.getElementById("description")
            .textContent =
            location.description;


        // COORDINATES

        document.getElementById("latitude")
            .textContent =
            location.latitude;

        document.getElementById("longitude")
            .textContent =
            location.longitude;


        // IMAGE

        const photo =
            document.getElementById("locationPhoto");

        photo.src =
            location.image + "?v=" + Date.now();


        // GOOGLE MAP EMBED

        const map =
            document.getElementById("mapFrame");

        map.src =
            "https://maps.google.com/maps?q="
            + location.latitude
            + ","
            + location.longitude
            + "&z=18&output=embed";


        // DIRECTIONS

        document.getElementById("directions").href =
            "https://www.google.com/maps/dir/?api=1&destination="
            + location.latitude
            + ","
            + location.longitude;

    }

    catch(error) {

        console.error(error);

        document.getElementById("name")
            .textContent =
            "Unable to load location.";

    }

}

loadLocation();

</script>

</body>

</html>
